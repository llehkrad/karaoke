<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Karaoke Pitch Sync</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 280px;
        padding: 14px;
        margin: 0;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #666;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-bottom: 12px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      input#roomId {
        background: #f2f2f2;
        color: #444;
      }
      button {
        width: 100%;
        padding: 9px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        color: #fff;
      }
      button.start {
        background: #2e7d32;
      }
      button.stop {
        background: #c62828;
      }
      button:disabled {
        background: #aaa;
        cursor: default;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #666;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      #status.error {
        color: #c62828;
      }
      #status.synced {
        color: #2e7d32;
      }
    </style>
  </head>
  <body>
    <h1>🎤 Karaoke Pitch Sync</h1>

    <label for="serverUrl">Server URL</label>
    <input id="serverUrl" type="text" placeholder="http://localhost:3001" />

    <label for="roomId">Room ID (from this tab)</label>
    <input id="roomId" type="text" readonly />

    <button id="toggleBtn" class="start">Start Pitch Sync</button>
    <div id="status">Open the Host Display page first.</div>

    <script src="popup.js"></script>
  </body>
</html>
